<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OCS-UI-TPL demo</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f6f8; font-family: "Menlo", "Monaco", monospace; color: #333; }
    .page-title { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h3 class="page-title">OCS-UI-TPL 模板演示(浏览器直载模式,无油猴环境,配置走内存存储)</h3>
  <p>页面加载后,右下(左)上角应出现 OCS 同款悬浮窗;包含「主面板」与「关于」两个面板页,可在标题栏切换。</p>

  <!-- 直接以 <script> 方式加载模板(等价于油猴 @require) -->
  <script src="./ocs-ui-tpl.user.js"></script>
  <script>
    (function () {
      'use strict';
      const { createScript, start, $ui, $modal, $message, h } = window.OCSUITpl;

      const Main = createScript({
        name: '主面板',
        notes: [
          '这是一个基于 OCS-UI-TPL 的示例面板。',
          ['配置项修改后自动保存。', '刷新页面后依然生效(内存模式则只在当前会话有效)。']
        ],
        configs: {
          enabled: { label: '启用功能', defaultValue: true },
          speed: { label: '执行速度', defaultValue: 2, attrs: { type: 'number', min: 1, max: 10, step: 1 } },
          mode: { label: '模式', defaultValue: 'auto', tag: 'select', options: [['自动', 'auto'], ['手动', 'manual']] },
          remark: { label: '备注', defaultValue: '', tag: 'textarea', attrs: { rows: 2, placeholder: '选填' } }
        },
        onrender({ panel }) {
          // 注意:$ui.button(text, attrs, handler) 的 handler 是「元素创建回调」,绑定事件需在其内设置 btn.onclick
          const runBtn = $ui.button('执行任务', {}, (btn) => {
            btn.onclick = () => {
              $message.success('任务完成! 模式=' + Main.cfg.mode + ' 速度=' + Main.cfg.speed);
            };
          });
          const confirmBtn = $ui.button('确认弹窗', {}, (btn) => {
            btn.onclick = () => {
              $modal.confirm({
                title: '确认',
                content: '是否继续执行?',
                onConfirm: function () { $message.info('已确认'); },
                onCancel: function () { $message.warn('已取消'); }
              });
            };
          });
          const alertBtn = $ui.button('提示弹窗', { className: 'base-style-button-secondary' }, (btn) => {
            btn.onclick = () => {
              $modal.alert({ title: '提示', content: '这是一条 alert 弹窗。' });
            };
          });
          const dropdown = h('dropdown-element', { trigger: 'click' });
          dropdown.triggerElement.textContent = '下拉菜单 ▾';
          dropdown.content.append(
            h('div', { className: 'dropdown-option' }, '选项 A'),
            h('div', { className: 'dropdown-option' }, '选项 B')
          );
          const copyEl = $ui.copy('示例文本', '这是一段可复制的文本');
          const galleryBtn = $ui.button('控件大全', {}, (btn) => { btn.onclick = controlGallery; });
          panel.body.append($ui.space([runBtn, confirmBtn, alertBtn, galleryBtn, dropdown], { x: 8 }));
          panel.body.append(h('p', { style: { marginTop: '8px' } }, copyEl));
        },
        methods() {
          return { run() { $message.info('通过 methods.run() 被调用'); } };
        }
      });

      const About = createScript({
        name: '关于',
        notes: ['本示例脚本演示 OCSUITpl 模板的常用能力。'],
        onrender({ panel }) {
          panel.body.append(
            h('p', 'OCS-UI-TPL 提取自 OCS 网课助手的悬浮窗 UI 框架'),
            h('p', { className: 'secondary' }, '底层框架: easy-us, MIT, github.com/enncy/easy-us')
          );
        }
      });

      function controlGallery() {
        var content = h('div', { style: { width: '430px' } }, function (root) {
          function section(title) { root.append(h('div', { className: 'separator' }, title)); }

          // 1. 按钮
          section('按钮 button');
          root.append($ui.space([
            $ui.button('主按钮', {}, function (b) { b.onclick = function () { $message.info('点击了主按钮'); }; }),
            $ui.button('次级按钮', { className: 'base-style-button-secondary' }, function (b) { b.onclick = function () { $message.info('点击了次级按钮'); }; }),
            $ui.button('危险按钮', { className: 'danger' }, function (b) { b.onclick = function () { $message.warn('危险操作'); }; }),
            $ui.button('禁用按钮', { disabled: true })
          ], { x: 8, y: 4 }));

          // 2. 表单控件
          section('表单控件 input / select / textarea');
          var sw = h('input', { type: 'checkbox', className: 'base-style-switch' });
          sw.checked = true;
          root.append($ui.space([
            h('label', { style: { lineHeight: '26px' } }, [sw, ' 开关']),
            h('input', { type: 'number', className: 'base-style-input', value: '2', style: { width: '70px' } }),
            h('input', { className: 'base-style-input', placeholder: '文本输入', style: { width: '120px' } }),
            h('select', { className: 'base-style-input', style: { width: '110px' } }, function (sel) {
              sel.append(h('option', { value: 'a' }, '选项 A'), h('option', { value: 'b' }, '选项 B'));
            })
          ], { x: 8, y: 4 }));
          root.append(h('textarea', { className: 'base-style-input', placeholder: '多行文本域', style: { width: '100%', height: '52px', marginTop: '4px' } }));

          // 3. 消息
          section('消息 message');
          root.append($ui.space([
            $ui.button('info', {}, function (b) { b.onclick = function () { $message.info('info 消息'); }; }),
            $ui.button('success', {}, function (b) { b.onclick = function () { $message.success('success 消息'); }; }),
            $ui.button('warn', {}, function (b) { b.onclick = function () { $message.warn('warn 消息'); }; }),
            $ui.button('error', { className: 'danger' }, function (b) { b.onclick = function () { $message.error('error 消息'); }; })
          ], { x: 8, y: 4 }));

          // 4. 弹窗嵌套
          section('弹窗 modal');
          root.append($ui.space([
            $ui.button('confirm', {}, function (b) { b.onclick = function () { $modal.confirm({ title: '确认弹窗', content: '要继续吗?', onConfirm: function () { $message.success('已确认'); } }); }; }),
            $ui.button('alert', {}, function (b) { b.onclick = function () { $modal.alert({ title: '提示弹窗', content: '纯提示,只有确定。' }); }; }),
            $ui.button('prompt', {}, function (b) { b.onclick = function () { $modal.prompt({ title: '输入弹窗', content: '请输入内容:', placeholder: '输入点什么', onConfirm: function (v) { $message.info('输入了: ' + v); } }); }; })
          ], { x: 8, y: 4 }));

          // 5. 其他: 下拉 / 复制 / 防误触
          section('其他 dropdown / copy / preventText');
          var dd = h('dropdown-element', { trigger: 'click' });
          dd.triggerElement.textContent = '下拉菜单 ▾';
          dd.content.append(h('div', { className: 'dropdown-option' }, '选项 1'), h('div', { className: 'dropdown-option' }, '选项 2'));
          root.append($ui.space([
            dd,
            $ui.copy('复制链接', 'https://github.com/Run-os/userscript-tpl'),
            $ui.preventText({ name: '防误触按钮', delay: 3, ondefault: function (span) { $message.success('延时执行成功'); } })
          ], { x: 8, y: 4 }));

          // 6. 列表 / 富文本
          section('文本 notes / HTML');
          root.append($ui.notes([
            '支持 <code>inline code</code> 等 HTML',
            ['子项: 渲染为嵌套列表'],
            '<a href="https://github.com/Run-os/userscript-tpl" target="_blank">仓库链接</a>'
          ], 'ol'));

          root.append(h('p', { className: 'secondary', style: { marginTop: '8px' } }, '提示:点击弹窗遮罩可关闭本弹窗'));
        });
        $modal.simple({ title: '所有可用控件', content: content, width: 470 });
      }

      start({ title: '示例脚本', scripts: [Main, About] });
    })();
  </script>
</body>
</html>
